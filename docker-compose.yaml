
# ProjectCerebro — Local Development Database Stack
# Databases: MongoDB, Cassandra, Redis, PostgreSQL + pgvector
# Credentials: cerebro / cerebro123 (dev only)
# Start:  docker-compose up -d
# Stop:   docker-compose down
# Logs:   docker-compose logs -f

services:

  # ── MongoDB ────────────────────────────────────────────
  # Stores: subject metadata, annotations, run info
  mongodb:
    image: mongo:7.0
    container_name: cerebro_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: cerebro
      MONGO_INITDB_ROOT_PASSWORD: cerebro123
      MONGO_INITDB_DATABASE: projectcerebro
    volumes:
      - ./volumes/mongodb:/data/db
    networks:
      - cerebro_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Cassandra ──────────────────────────────────────────
  # Stores: raw EEG time-series samples
  cassandra:
    image: cassandra:4.1
    container_name: cerebro_cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: CerebroCluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 2G
    volumes:
      - ./volumes/cassandra:/var/lib/cassandra
    networks:
      - cerebro_network
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 90s

  # ── Redis ──────────────────────────────────────────────
  # Stores: inference cache, real-time prediction state
  redis:
    image: redis:7.2-alpine
    container_name: cerebro_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass cerebro123
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - ./volumes/redis:/data
    networks:
      - cerebro_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cerebro123", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── PostgreSQL + pgvector ──────────────────────────────
  # Stores: 128-dimensional trial embeddings for similarity search
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cerebro_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: cerebro
      POSTGRES_PASSWORD: cerebro123
      POSTGRES_DB: projectcerebro
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cerebro_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerebro -d projectcerebro"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── MLflow ─────────────────────────────────────────────
  # Tracks training runs, metrics, parameters, and checkpoints
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    container_name: cerebro_mlflow
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./artifacts/mlflow:/mlflow_artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlruns
      --default-artifact-root /mlflow_artifacts
      --serve-artifacts
    environment:
      MLFLOW_TRACKING_URI: http://0.0.0.0:5000
    networks:
      - cerebro_network
    
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cerebro_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - cerebro_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cerebro_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - cerebro_network

# ── Network ────────────────────────────────────────────────
networks:
  cerebro_network:
    driver: bridge
    name: cerebro_network
